<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191512">
  <meta name="description" content="Choose a build and play Brotato in your browser.">
  <title>Brotato: Web Port</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --rust: #c43d25;
      --cream: #eee0c2;
      --black: #171310;

      --mouse-x: 0;
      --mouse-y: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      overflow-x: hidden;
      color: var(--cream);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold",
        "Franklin Gothic Heavy", sans-serif;
      background: #191512;
    }

    /* Background image with mouse-follow parallax */
    .background {
      position: fixed;
      z-index: -3;
      inset: -35px;
      pointer-events: none;
      background-image: url("localBuild/background.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      transform:
        translate3d(
          calc(var(--mouse-x) * -13px),
          calc(var(--mouse-y) * -13px),
          0
        )
        scale(1.09);
      filter: blur(2px) saturate(1.15) contrast(1.08);
      will-change: transform;
    }

    .background-overlay {
      position: fixed;
      z-index: -2;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(20, 13, 9, 0.08) 0%,
          rgba(20, 13, 9, 0.22) 48%,
          rgba(10, 8, 7, 0.7) 100%
        ),
        linear-gradient(
          180deg,
          rgba(15, 12, 10, 0.15),
          rgba(15, 12, 10, 0.4)
        );
    }

    #ash-particles {
      position: fixed;
      z-index: -1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.72;
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      text-align: center;
      animation: enter 650ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .subtitle {
      margin: 24px 0 36px;
      color: #fff0d1;
      font-family: "Courier New", monospace;
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 2px 2px 2px #000, 0 0 12px #000;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 22px;
      width: 100%;
    }

    .build-button {
      display: flex;
      flex: 1;
      min-height: 88px;
      max-width: 310px;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;

      border: 3px solid var(--black);
      border-radius: 4px;
      background: var(--rust);

      color: #fff0d1;
      font-size: clamp(1.35rem, 4vw, 2.1rem);
      letter-spacing: 1px;
      line-height: 1;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);

      box-shadow: 0 4px 0 var(--black);

      transition:
        transform 120ms ease,
        background-color 120ms ease,
        box-shadow 120ms ease;
    }

    .build-button:nth-child(2) {
      background: #2d2721;
    }

    .build-button:hover {
      background: #d94a2e;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--black);
    }

    .build-button:nth-child(2):hover {
      background: #453a30;
    }

    .build-button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--black);
    }

    .build-button:focus-visible,
    footer a:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    footer {
      margin-top: 48px;
      color: #f2e5cb;
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.9;
      text-shadow: 1px 2px 3px #000, 1px 1px #000;
    }

    footer a {
      color: #ffb19b;
      text-decoration: underline;
      text-decoration-style: dashed;
      text-underline-offset: 3px;
    }

    @keyframes enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 16px;
      }

      .background {
        inset: -12px;
        transform: scale(1.04);
        filter: blur(2px) saturate(1.1) contrast(1.05);
      }

      .subtitle {
        margin: 20px 0 28px;
        letter-spacing: 2px;
      }

      .buttons {
        gap: 14px;
      }

      .build-button {
        min-height: 76px;
        padding: 12px 8px;
        font-size: clamp(1.05rem, 5vw, 1.45rem);
        letter-spacing: 0;
      }

      footer {
        margin-top: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

      .background {
        transform: scale(1.04);
        will-change: auto;
      }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true"></div>
  <div class="background-overlay" aria-hidden="true"></div>
  <canvas id="ash-particles" aria-hidden="true"></canvas>

  <main class="content">
    <p class="subtitle">By Blobfish</p>

    <nav class="buttons" aria-label="Choose a game build">
      <a class="build-button" href="localBuild/index.html">Local Build</a>
      <a class="build-button" href="externalBuild/index.html">External Build</a>
    </nav>

    <footer>
      Ported By Shayder &amp; smiledemic<br>
      <a href="https://github.com/smiledemic/brotatodlc-web">SOURCE CODE</a>
    </footer>
  </main>

  <script>
    // Mouse-follow parallax
    (() => {
      const root = document.documentElement;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const finePointer = window.matchMedia("(pointer: fine)");

      if (reducedMotion.matches || !finePointer.matches) return;

      let frame = 0;
      let x = 0;
      let y = 0;

      window.addEventListener("pointermove", event => {
        x = (event.clientX / window.innerWidth - 0.5) * 2;
        y = (event.clientY / window.innerHeight - 0.5) * 2;

        if (frame) return;

        frame = requestAnimationFrame(() => {
          root.style.setProperty("--mouse-x", x.toFixed(3));
          root.style.setProperty("--mouse-y", y.toFixed(3));
          frame = 0;
        });
      }, { passive: true });

      document.addEventListener("pointerleave", () => {
        root.style.setProperty("--mouse-x", "0");
        root.style.setProperty("--mouse-y", "0");
      });
    })();

    // Sparse rising ash, dust, and jagged debris
    (() => {
      const canvas = document.getElementById("ash-particles");
      const ctx = canvas.getContext("2d");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      if (!ctx || reducedMotion.matches) return;

      let width = 0;
      let height = 0;
      let particles = [];
      let lastTime = 0;
      let spawnBank = 0;
      let animationId = 0;
      let isRunning = false;

      const colors = ["#c43d25", "#8d3925", "#e0b98a", "#42372e", "#d5c5a5"];

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        particles = particles.filter(p => p.y < height + 20);
      }

      function spawnParticle() {
        const size = Math.random() < 0.78
          ? 1 + Math.random() * 2
          : 3 + Math.random() * 2;

        particles.push({
          x: Math.random() * width,
          y: height + 8,
          size,
          vx: (Math.random() - 0.5) * 0.65,
          vy: -(15 + Math.random() * 38),
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 0.5 + Math.random() * 2,
          life: 0,
          maxLife: 5 + Math.random() * 7,
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 0.15 + Math.random() * 0.38,
          shape: Math.random() < 0.65 ? "chip" : "dust"
        });
      }

      function drawParticle(p) {
        const progress = p.life / p.maxLife;
        const fadeIn = Math.min(progress * 7, 1);
        const fadeOut = Math.min((1 - progress) * 3, 1);
        const alpha = p.alpha * fadeIn * fadeOut;

        if (alpha <= 0) return;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;

        if (p.shape === "chip") {
          ctx.beginPath();
          ctx.moveTo(-p.size, -p.size * 0.35);
          ctx.lineTo(p.size * 0.8, -p.size);
          ctx.lineTo(p.size, p.size * 0.45);
          ctx.lineTo(-p.size * 0.4, p.size);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillRect(-p.size * 0.5, -p.size * 0.5, p.size, p.size * 0.7);
        }

        ctx.restore();
      }

      function animate(time) {
        if (!isRunning) return;

        animationId = requestAnimationFrame(animate);

        const dt = Math.min((time - (lastTime || time)) / 1000, 0.04);
        lastTime = time;

        ctx.clearRect(0, 0, width, height);

        spawnBank += dt * (width < 600 ? 5 : 8);

        while (spawnBank >= 1) {
          if (particles.length < 65) spawnParticle();
          spawnBank--;
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];

          p.life += dt;
          p.wobble += p.wobbleSpeed * dt;
          p.x += (p.vx + Math.sin(p.wobble) * 0.35) * 35 * dt;
          p.y += p.vy * dt;
          p.rotation += p.spin * dt;

          if (p.life >= p.maxLife || p.y < -20) {
            particles.splice(i, 1);
            continue;
          }

          drawParticle(p);
        }
      }

      function start() {
        if (isRunning || document.hidden) return;

        isRunning = true;
        lastTime = 0;
        animationId = requestAnimationFrame(animate);
      }

      function stop() {
        isRunning = false;
        cancelAnimationFrame(animationId);
        animationId = 0;
      }

      window.addEventListener("resize", resize);

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else start();
      });

      reducedMotion.addEventListener("change", event => {
        if (event.matches) {
          stop();
          ctx.clearRect(0, 0, width, height);
        } else {
          start();
        }
      });

      resize();
      start();
    })();
  </script>
</body>
</html>
